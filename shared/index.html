<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base compartilhada · Atualizações em Pediatria</title><style>
  :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#07090d;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1b2330 0,#080a0f 38rem);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}header{display:grid;gap:10px;margin-bottom:22px}.eyebrow{color:#9fb1c8;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem}h1{margin:0;font-size:clamp(1.7rem,4vw,3rem)}p{color:#bac4d2;line-height:1.55;max-width:78ch}.bar{display:grid;grid-template-columns:1fr auto;gap:10px;position:sticky;top:0;padding:12px 0;background:linear-gradient(#080a0fee,#080a0dcc);backdrop-filter:blur(12px);z-index:2}input,select{width:100%;border:1px solid #344154;background:#10151e;color:#fff;border-radius:12px;padding:13px 14px;font:inherit}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.pill{border:1px solid #2c394d;background:#0e141e;border-radius:999px;padding:8px 11px;color:#cbd7e8;font-size:.84rem}.grid{display:grid;gap:12px}.card{border:1px solid #263247;background:linear-gradient(145deg,#101722,#0b1018);border-radius:16px;padding:16px}.kind{color:#85b7ff;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em}.card h2{font-size:1.05rem;margin:.35rem 0}.meta{color:#8f9caf;font-size:.82rem}.summary{white-space:pre-wrap;overflow-wrap:anywhere;color:#c7d0dc;font-size:.9rem;line-height:1.45;max-height:9.5rem;overflow:auto}details{margin-top:10px}summary{cursor:pointer;color:#9fc7ff}.empty{padding:40px;text-align:center;color:#9aa7b8}@media(max-width:640px){.bar{grid-template-columns:1fr}.wrap{padding:20px 12px 44px}.card{padding:14px}}
  </style></head><body><main class="wrap"><header><div class="eyebrow">Integração clínica contextual</div><h1>Base compartilhada · Atualizações em Pediatria</h1><p>Conteúdo consolidado dos SitesGPTs, preservando fonte, população e contexto. Regimes numéricos não são promovidos automaticamente para cálculo ou prescrição sem validação específica no destino.</p></header><section class="bar"><input id="q" type="search" placeholder="Buscar diagnóstico, medicamento, terapêutica ou escore" autocomplete="off"><select id="kind"><option value="all">Todos</option><option value="diagnosis">Diagnósticos</option><option value="medication">Medicamentos</option><option value="therapy">Terapêuticas</option><option value="score">Escores</option><option value="pedwb">Referências PedWB</option><option value="document">Documentos do projeto</option></select></section><div id="stats" class="stats"></div><section id="results" class="grid"><div class="empty">Carregando a base…</div></section></main><script>
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let entries=[];let data;
  const add=(kind,arr)=>{for(const item of arr||[])entries.push({kind,item,name:item.name||item.title||item.id||'Sem título',blob:norm(JSON.stringify(item))})};
  fetch('./knowledge.json').then(r=>{if(!r.ok)throw Error('Falha ao carregar');return r.json()}).then(x=>{data=x;add('diagnosis',x.diagnoses);add('medication',x.medications);add('therapy',x.therapies);add('score',x.scores);add('pedwb',x.pedwbTopics);add('document',x.documents);document.querySelector('#stats').innerHTML=['diagnoses','medications','therapies','scores','pedwbTopics','documents'].map(k=>'<span class="pill">'+esc(k)+': '+(x[k]?.length||0)+'</span>').join('');render()}).catch(e=>document.querySelector('#results').innerHTML='<div class="empty">'+esc(e.message)+'</div>');
  function render(){const q=norm(document.querySelector('#q').value),kind=document.querySelector('#kind').value;const list=entries.filter(e=>(kind==='all'||e.kind===kind)&&(!q||e.blob.includes(q))).slice(0,250);document.querySelector('#results').innerHTML=list.length?list.map(e=>{const src=e.item.sources?.map(s=>s.site).filter(Boolean).join(' · ')||e.item.sourceSite||e.item.site||'';const detail=JSON.stringify(e.item,null,2);return '<article class="card"><div class="kind">'+esc(e.kind)+'</div><h2>'+esc(e.name)+'</h2><div class="meta">'+esc(src)+'</div><details><summary>Ver conteúdo e proveniência</summary><pre class="summary">'+esc(detail)+'</pre></details></article>'}).join(''):'<div class="empty">Nenhum resultado neste escopo.</div>'}
  document.querySelector('#q').addEventListener('input',render);document.querySelector('#kind').addEventListener('change',render);
  </script></body></html>
